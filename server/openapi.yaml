openapi: 3.1.0
info:
  title: Yosuga Hub API
  description: Yosuga Hub が同期した、AI向けの状況データを配信する。
  version: "1.0.0"
servers:
  # ★ あなたのドメインに書き換えてから GPT に登録する
  - url: https://YOUR-DOMAIN.example.com/yosuga
paths:
  /api.php:
    get:
      operationId: getYosugaFile
      summary: 状況データを1つ取得する
      description: >-
        用途ごとに分割された状況データを1つ取得する。
        まず file=index で更新時刻を確認し、必要なものだけ取得すること。
      parameters:
        - name: file
          in: query
          required: true
          description: >-
            index=更新時刻の一覧 / projects=各ゲームの状況 / tasks=タスク /
            knowledge=情報アイテムと観察日記(既存タグの語彙) / calendar=予定 /
            conversations=取込履歴 / documents=未整理文書(分類対象) /
            directives=配信中の指示書
          schema:
            type: string
            enum:
              - index
              - projects
              - tasks
              - knowledge
              - calendar
              - conversations
              - documents
              - directives
      responses:
        "200":
          description: 取得したJSON。含まれるキーは file により異なる。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YosugaData"
        "400":
          description: file の指定が不正
        "403":
          description: トークンが一致しない
        "404":
          description: そのファイルはまだ同期されていない
components:
  schemas:
    YosugaData:
      type: object
      description: file により内容が異なる。該当しないキーは省略される。
      properties:
        ok:
          type: boolean
          description: index のときのみ
        schemaVersion:
          type: integer
        generatedAt:
          type: string
          description: 同期した時刻(ISO 8601)
        files:
          type: array
          description: index の一覧
          items:
            $ref: "#/components/schemas/FileEntry"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Record"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Record"
        items:
          type: array
          description: knowledge の情報アイテム
          items:
            $ref: "#/components/schemas/Record"
        diary:
          type: array
          description: 観察日記
          items:
            $ref: "#/components/schemas/Record"
        today:
          type: array
          items:
            $ref: "#/components/schemas/Record"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/Record"
        past:
          type: array
          items:
            $ref: "#/components/schemas/Record"
        exchanges:
          type: array
          description: 回答JSONの取込・承認の履歴
          items:
            $ref: "#/components/schemas/Record"
        pendingClassification:
          type: array
          description: 分類してほしい未整理文書
          items:
            $ref: "#/components/schemas/PendingDocument"
        directives:
          type: array
          description: 配信中の指示書
          items:
            $ref: "#/components/schemas/Record"
        note:
          type: string
          description: 読み手への注意書き
    FileEntry:
      type: object
      description: どのファイルがいつ更新されたか
      properties:
        file:
          type: string
        updatedAt:
          type: string
    PendingDocument:
      type: object
      description: 未整理文書。documentId は回答JSONの document_id にそのまま使う。
      properties:
        documentId:
          type: string
          description: 分類結果を返すときの宛先。推測で作らない。
        title:
          type: string
        body:
          type: string
          description: 原文。書き換えない。
        status:
          type: string
        createdAt:
          type: string
    Record:
      type: object
      description: 汎用レコード。実際のキーは file ごとに異なる。
      properties:
        id:
          type: string
        title:
          type: string
  securitySchemes:
    yosugaToken:
      type: apiKey
      in: header
      name: X-Yosuga-Token
security:
  - yosugaToken: []
